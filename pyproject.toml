[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kaggle-mcp"
version = "0.1.0"
description = "Lightweight, security-focused MCP server for Kaggle (notebooks, competitions, datasets, models) for Claude and ChatGPT."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27,<1",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
kaggle-mcp = "kaggle_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kaggle_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
